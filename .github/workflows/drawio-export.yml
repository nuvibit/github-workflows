name: DRAW.IO EXPORT

on:
  workflow_call:
    inputs:
      drawio_path:
        description: 'Path where drawio diagrams are stored'
        default: "."
        required: false
        type: string
      commit_user:
        description: 'Username which should be used for commits by github action'
        default: 'github-actions'
        required: false
        type: string
      commit_email:
        description: 'Email which should be used for commits by github action'
        default: 'noreply@github.com'
        required: false
        type: string

concurrency:
  group: drawio-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drawio-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export drawio files to asciidoctor and png files
        uses: rlespinasse/drawio-export-action@6900c4d8a1fb066e0a0a3570574439487546feab # v2
        with:
          path: ${{ inputs.drawio_path }}
          format: png
          transparent: false
          action-mode: all
          remove-page-suffix: true
          scale: 2
          quality: 95
          uncompressed: true

      - name: Commit Changes
        run: |
          git config --local user.name "${{ inputs.commit_user }}"
          git config --local user.email "${{ inputs.commit_email }}"
          git add .
          if [[ -z $(git status -s) ]]; then
            echo "diff=false" >> $GITHUB_OUTPUT
          else
            echo "diff=true" >> $GITHUB_OUTPUT
          fi
          git diff-index --quiet HEAD || git commit -m "docs: sync draw.io exported files" -a

      - name: Push Changes
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1
        with:
          github_token: ${{ steps.github_app_token.outputs.token }}
          branch: ${{ github.ref }}